name: Arduino CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: arduino-cli core install arduino:avr

      - name: Compile sketch
        run: arduino-cli compile --fqbn arduino:avr:uno src/Traffic_Light_System/Traffic_Light_System.ino
